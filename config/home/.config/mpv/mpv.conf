# mpv settings for Digma CITI 1804 (Atom x5-Z8350, Intel i965 VA-API)
# Hardware H.264 decoding through the graphics chip
hwdec=vaapi
vo=gpu
# YouTube via yt-dlp: H.264 only, at most 720p (lighter for this tablet)
ytdl-format=bestvideo[height<=?720][vcodec^=avc1]+bestaudio/best[height<=?720]
# Larger audio buffer against stutter (default 0.2 s)
audio-buffer=0.5
# Network cache
cache=yes
demuxer-max-bytes=64MiB
